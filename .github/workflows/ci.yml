name: Verify Cash Review
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - run: python -m pip install -r backend/requirements.lock.txt
      - run: python -m pytest backend/tests -q
      - name: Check experimental research contracts without models or media
        run: |
          python -m pip install --no-deps Pillow==13.0.0
          python backend/research/siglip2/check_contract.py
          python backend/research/dino_memory/check_contract.py
          python -m compileall -q backend/research/siglip2
          python -m compileall -q backend/research/dino_memory
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
